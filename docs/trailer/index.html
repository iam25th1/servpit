<!doctype html>
<!--
  The SERVPIT trailer.

  One timeline, driven by frame number rather than the clock: render.mjs asks
  for frame 0, 1, 2 and so on, and every frame comes out the same every time.
  The fight is a real round replayed through the game's own resolver and
  renderer (round.json, from extract.ts); everything said on screen is in
  src/cut.ts with where it came from. Text is set in Inter so it reads at a
  glance; the game's pixel art stays pixel art, at whole number scales.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SERVPIT trailer</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: "Inter"; font-weight: 400; src: url("/fonts/inter-latin-400-normal.woff2") format("woff2"); font-display: block; }
@font-face { font-family: "Inter"; font-weight: 500; src: url("/fonts/inter-latin-500-normal.woff2") format("woff2"); font-display: block; }
@font-face { font-family: "Inter"; font-weight: 700; src: url("/fonts/inter-latin-700-normal.woff2") format("woff2"); font-display: block; }
@font-face { font-family: "Inter"; font-weight: 800; src: url("/fonts/inter-latin-800-normal.woff2") format("woff2"); font-display: block; }
:root {
  --pit-deep: #0d0f0a;
  --bone: #e8e2cf; --bone-dim: #b5afa0; --bone-bright: #f0ebdb;
  --amber: #ffb300; --good: #8bc34a; --bad: #e05a3a;
  --tier-common: #7cb342; --tier-uncommon: #42a5f5; --tier-rare: #ffb300;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--pit-deep); overflow: hidden; }
body { color: var(--bone); font-family: "Inter", sans-serif; font-weight: 500; }
#stage { position: relative; overflow: hidden; background: var(--pit-deep); }
.px { image-rendering: pixelated; display: block; }
.scene { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 var(--gutter); gap: var(--gap); }
.head { font-size: var(--head); font-weight: 700; color: var(--bone-dim); }
.line { font-size: var(--text); line-height: 1.2; }
.num { font-size: var(--num); font-weight: 800; color: var(--amber); letter-spacing: -0.01em; font-feature-settings: "tnum" 1; }
.note { font-size: var(--note); font-weight: 400; color: var(--bone-dim); margin-top: 6px; }
.amber { color: var(--amber); } .good { color: var(--good); } .bad { color: var(--bad); }
.quote { display: flex; gap: 32px; align-items: flex-start; }
.quote .said { font-size: var(--text); font-weight: 500; color: var(--bone-bright); line-height: 1.25; }
.quote .who { font-size: var(--note); font-weight: 700; color: var(--bone-dim); margin-bottom: 6px; }
.quote .did { font-size: var(--note); font-weight: 700; margin-top: 8px; }
.face { flex: none; width: 144px; height: 144px; background-size: 144px 144px; image-rendering: pixelated; position: relative; }
.face img { position: absolute; left: 15px; top: 15px; width: 114px; height: 114px; image-rendering: pixelated; }
.tiers { display: grid; grid-template-columns: max-content max-content; column-gap: 40px; row-gap: 8px; font-size: var(--text); }
.tiers .v { font-weight: 800; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="dist/trailer.js"></script>
</body>
</html>
